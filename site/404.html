<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found</title>
  <!-- Absolute paths: this page is served for any missing URL, at any depth. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/script.js"></script>
</head>
<body>
  <main class="not-found">
    <div class="container">
      <p class="eyebrow"><span aria-hidden="true">$ </span>curl -I this-page</p>
      <h1>404</h1>
      <p class="lede">That page doesn't exist, or it moved.</p>
      <a class="btn btn-primary" href="/">Back to the homepage</a>
    </div>
  </main>
</body>
</html>
